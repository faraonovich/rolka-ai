<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Void RP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #07060b;
      --surface: #13111c;
      --surface-2: #1c1929;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #a855f7;
      --accent-2: #9333ea;
      --text: #f4f2f8;
      --muted: #8e899e;
    }
    * {
      box-sizing: border-box;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, rgba(147, 51, 234, 0.16), transparent 45%), var(--bg);
      color: var(--text);
      padding: 12px 12px 92px 12px;
    }
    .screen { display: none; }
    .screen.active { display: block; animation: fade .18s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Фильтры каталога */
    .top-filters { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .pill-btn {
      height: 36px; padding: 0 12px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
      cursor: pointer; white-space: nowrap;
    }
    .pill-btn.active { background: #231e36; border-color: rgba(168, 85, 247, 0.45); }
    .search-box {
      flex: 1; height: 36px; border-radius: 999px; background: var(--surface);
      border: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 6px;
    }
    .search-box input { width: 100%; background: transparent; border: none; color: var(--text); font-size: 13px; padding: 0; }
    .icon-circle {
      width: 36px; height: 36px; border-radius: 50%; background: var(--surface);
      border: 1px solid var(--border); color: var(--text); display: grid; place-items: center;
      cursor: pointer; flex-shrink: 0; font-size: 15px;
    }
    .icon-circle.active { background: #231e36; border-color: rgba(168, 85, 247, 0.6); }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; padding: 6px 12px; border-radius: 999px; background: var(--surface);
      border: 1px solid var(--border); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .count { font-size: 12px; color: var(--muted); margin: 0 2px 8px; }

    /* Сетка карточек */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .char-tile {
      position: relative; height: 245px; border-radius: 18px; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border); cursor: pointer;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 10px;
    }
    .char-tile .art-bg {
      position: absolute; inset: 0; display: grid; place-items: center; font-size: 64px;
      background: radial-gradient(circle at 50% 30%, rgba(168, 85, 247, 0.28), transparent 65%),
                  linear-gradient(180deg, #1a1628 0%, #0b0911 100%);
    }
    .art {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 18%;
      opacity: 0; transition: opacity .35s ease;
    }
    .art.ok { opacity: 1; }
    .art-bg .mono { font-size: 76px; font-weight: 800; color: rgba(168, 85, 247, 0.22); letter-spacing: -2px; user-select: none; }
    .sheet-art .art-bg .mono { font-size: 96px; }
    .art-bg.shimmer::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.05) 50%, transparent 70%);
      background-size: 200% 100%; animation: shim 1.4s linear infinite;
    }
    @keyframes shim { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .char-tile .overlay-grad {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 22%, rgba(7, 6, 11, 0.55) 48%, rgba(7, 6, 11, 0.88) 70%, rgba(7, 6, 11, 0.98) 100%);
    }
    .char-tile .content { position: relative; z-index: 2; }
    .char-tile h4 { margin: 4px 0 2px 0; font-size: 14px; font-weight: 700; text-shadow: 0 1px 6px #000; }
    .char-tile .anime { font-size: 10.5px; color: #d6b8ff; font-weight: 600; margin-bottom: 4px; text-shadow: 0 1px 4px #000; }
    .char-tile p {
      margin: 4px 0 0 0; font-size: 11px; color: #d4cfe0; line-height: 1.3; text-shadow: 0 1px 4px rgba(0,0,0,.9);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
      background: rgba(168, 85, 247, 0.22); border: 1px solid rgba(168, 85, 247, 0.4); color: #e6d4ff;
    }
    .tag.alt { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); color: #ddd; }
    .fav-mark { position: absolute; top: 8px; right: 10px; z-index: 3; font-size: 15px; text-shadow: 0 1px 6px #000; }
    .mine-mark {
      position: absolute; top: 8px; left: 8px; z-index: 3; font-size: 10px; font-weight: 700;
      background: rgba(25, 22, 36, 0.85); border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px;
    }
    .create-tile .art-bg {
      background: radial-gradient(circle, rgba(255,255,255,0.22) 1px, transparent 1px), linear-gradient(180deg, #161224, #0a0811);
      background-size: 18px 18px, 100% 100%;
    }
    .free-pill {
      position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
      background: rgba(25, 22, 36, 0.9); border: 1px solid var(--border); padding: 6px 14px;
      border-radius: 12px; font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 10px; grid-column: 1 / -1; }

    /* Нижний бар */
    .dock {
      position: fixed; left: 14px; right: 14px; bottom: 14px; height: 62px; border-radius: 22px;
      background: rgba(23, 21, 31, 0.92); backdrop-filter: blur(18px); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-around; padding: 0 8px; z-index: 50;
      box-shadow: 0 12px 32px rgba(0,0,0,0.65);
    }
    .dock-btn {
      width: 44px; height: 44px; border-radius: 14px; border: 1px solid transparent; background: transparent;
      color: var(--muted); font-size: 20px; display: grid; place-items: center; cursor: pointer;
    }
    .dock-btn.active { color: #fff; border-color: rgba(255,255,255,0.55); background: rgba(255,255,255,0.05); }
    .dock-plus {
      width: 42px; height: 42px; border-radius: 50%; background: var(--accent-2); color: #fff;
      border: none; font-size: 22px; display: grid; place-items: center; cursor: pointer;
    }

    .btn-purple {
      width: 100%; padding: 13px; border-radius: 14px; border: none; background: var(--accent);
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 8px;
    }
    .btn-dark {
      width: 100%; padding: 13px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-danger { color: #ff8a9b; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row > * { flex: 1; }

    /* Шторки */
    .sheet-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 80; align-items: flex-end;
    }
    .sheet-backdrop.open { display: flex; }
    .sheet {
      width: 100%; max-height: 90vh; overflow-y: auto; background: #14121d;
      border-top-left-radius: 24px; border-top-right-radius: 24px; border-top: 1px solid var(--border);
      padding: 10px 16px 24px 16px; animation: fade .18s ease;
    }
    .handle { width: 38px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.2); margin: 0 auto 12px auto; }
    .sheet h3 { margin: 0 0 14px 0; font-size: 18px; }
    .sheet-art {
      position: relative; height: 250px; border-radius: 18px; overflow: hidden; margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .sheet-art .art-bg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 80px;
      background: radial-gradient(circle at 50% 30%, rgba(168,85,247,.3), transparent 65%), linear-gradient(180deg,#1a1628,#0b0911); }
    .sheet-art .overlay-grad { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(20,18,29,.98) 100%); }
    .sheet-art .cap { position: absolute; left: 14px; right: 14px; bottom: 10px; z-index: 2; }
    .sheet-art h2 { margin: 0 0 2px; font-size: 21px; }
    .sheet-art .anime { color: #c9a8f5; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .info { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
    .info b { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
    .info span { font-size: 13.5px; line-height: 1.42; }
    .scene-opt {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px;
      margin-bottom: 8px; cursor: pointer;
    }
    .scene-opt.sel { border-color: rgba(168,85,247,.8); background: #1d1830; }
    .scene-opt .mood { font-size: 11px; color: #c9a8f5; font-weight: 700; }
    .scene-opt .st { font-size: 14px; font-weight: 700; margin: 2px 0; }
    .scene-opt .tx { font-size: 12.5px; color: #b9b4c6; line-height: 1.4; }

    .sheet-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); font-size: 15px; gap: 10px; }
    .sheet-row .lbl small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
    .seg { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; margin: 8px 0 4px; }
    .seg button { flex: 1; border: none; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 8px 4px; border-radius: 9px; cursor: pointer; }
    .seg button.on { background: var(--accent); color: #fff; }
    .set-title { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
    .switch { width: 46px; height: 26px; border-radius: 999px; background: #2a2640; position: relative; cursor: pointer; flex-shrink: 0; transition: .2s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
    .switch.on { background: var(--accent); }
    .switch.on::after { left: 23px; }

    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px 0; }
    input, textarea, select {
      width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 12px; color: var(--text); font-size: 14px;
    }
    textarea { min-height: 70px; resize: vertical; }
    select option { background: #14121d; }
    .page-title { display: flex; align-items: center; gap: 10px; margin: 2px 0 6px; }
    .page-title h2 { margin: 0; font-size: 20px; }
    .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
    .toast {
      position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: #231e36;
      border: 1px solid rgba(168,85,247,.5); padding: 9px 16px; border-radius: 999px; font-size: 13px;
      z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- КАТАЛОГ -->
  <div class="screen active" id="screen-catalog">
    <div class="top-filters">
      <div class="search-box">🔍 <input id="q" placeholder="Имя, аниме или характер" oninput="renderCatalog()" /></div>
      <button class="icon-circle" id="favBtn" onclick="toggleFavFilter()">⭐</button>
    </div>
    <div class="top-filters" style="margin-bottom:8px">
      <select id="animeSel" onchange="renderCatalog()" style="height:36px;border-radius:999px;padding:0 12px;font-size:13px"></select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- СОЗДАНИЕ / РЕДАКТИРОВАНИЕ -->
  <div class="screen" id="screen-create">
    <div class="page-title"><h2 id="createTitle">Новый персонаж</h2></div>
    <label>Имя *</label><input id="c_name" maxlength="40" placeholder="Например: Рэй" />
    <label>Из какого аниме / мира (необязательно)</label><input id="c_anime" maxlength="40" placeholder="Своё аниме / оригинал" />
    <label>Эмодзи (показывается в сообщениях бота)</label><input id="c_ava" maxlength="4" placeholder="🌑" />
    <label>Ссылка на арт (необязательно, прямая ссылка на картинку)</label><input id="c_art" placeholder="https://..." />
    <label>Характер (выбери 1–2)</label>
    <div class="chips" id="c_tags" style="flex-wrap:wrap;overflow:visible"></div>
    <label>Описание: кто это, прошлое, как выглядит *</label><textarea id="c_desc" maxlength="320" placeholder="Взрослый персонаж..."></textarea>
    <label>Речевой стиль</label><textarea id="c_speech" maxlength="200" placeholder="Короткие фразы, сарказм, обращается на «ты»..."></textarea>
    <label>Манера реакций</label><textarea id="c_react" maxlength="200" placeholder="На грубость отвечает холодом, на доброту теряется..."></textarea>
    <label>Триггеры (что задевает / включает)</label><textarea id="c_trig" maxlength="160" placeholder="Враньё, жалость к себе, угрозы близким..."></textarea>
    <label>Отношение к инициативе</label>
    <select id="c_init">
      <option value="lead">Ведёт сцену сам</option>
      <option value="mix" selected>Подстраивается, делит инициативу</option>
      <option value="follow">Ждёт инициативы собеседника</option>
    </select>
    <label>Стартовая сцена (от лица персонажа, действия в *звёздочках*)</label>
    <textarea id="c_scene" maxlength="260" placeholder="*Персонаж поднимает взгляд от книги.* Ты опоздал."></textarea>
    <div class="hint">Все персонажи — взрослые. Лишнее можно оставить пустым: недостающее бот достроит по описанию.</div>
    <div style="height:14px"></div>
    <button class="btn-purple" onclick="saveCustom()">Сохранить персонажа</button>
    <button class="btn-dark" onclick="showScreen('catalog')">Отмена</button>
  </div>

  <!-- ШТОРКА ПЕРСОНАЖА -->
  <div class="sheet-backdrop" id="charSheet" onclick="if(event.target===this)closeSheet('charSheet')">
    <div class="sheet" id="charSheetBody"></div>
  </div>

  <!-- ШТОРКА НАСТРОЕК -->
  <div class="sheet-backdrop" id="setSheet" onclick="if(event.target===this)closeSheet('setSheet')">
    <div class="sheet">
      <div class="handle"></div>
      <h3>Стиль общения</h3>

      <div class="set-title">Динамика: кто ведёт сцену</div>
      <div class="seg" id="seg_dynamic">
        <button data-v="user" onclick="setOpt('dynamic','user')">Веду я</button>
        <button data-v="mix" onclick="setOpt('dynamic','mix')">Баланс</button>
        <button data-v="char" onclick="setOpt('dynamic','char')">Ведёт персонаж</button>
      </div>

      <div class="set-title">Длина ответа</div>
      <div class="seg" id="seg_length">
        <button data-v="short" onclick="setOpt('length','short')">Коротко</button>
        <button data-v="medium" onclick="setOpt('length','medium')">Средне</button>
        <button data-v="long" onclick="setOpt('length','long')">Подробно</button>
      </div>

      <div class="set-title">Жёсткость сцены</div>
      <div class="seg" id="seg_hardness">
        <button data-v="Лайт" onclick="setOpt('hardness','Лайт')">Лайт</button>
        <button data-v="Средне" onclick="setOpt('hardness','Средне')">Средне</button>
        <button data-v="Хардкор" onclick="setOpt('hardness','Хардкор')">Хардкор</button>
      </div>

      <div class="sheet-row">
        <div class="lbl">Мат в речи<small>Только если подходит характеру</small></div>
        <div class="switch" id="sw_swearing" onclick="setOpt('swearing', !S.settings.swearing)"></div>
      </div>

      <div class="set-title">Сюжет</div>
      <select id="plotSel" onchange="setOpt('plot', this.value)"></select>
      <label>Свой сюжет (если заполнено — важнее списка)</label>
      <textarea id="plotCustom" maxlength="220" placeholder="Например: мы напарники, застрявшие в заброшенной станции метро..." oninput="setOpt('plotCustom', this.value, true)"></textarea>
      <div style="height:14px"></div>
      <button class="btn-purple" onclick="closeSheet('setSheet')">Готово</button>
      <button class="btn-dark btn-danger" onclick="resetAll()">Сбросить мои данные</button>
    </div>
  </div>

  <div class="dock">
    <button class="dock-btn active" id="dk-catalog" onclick="showScreen('catalog')">🏠</button>
    <button class="dock-plus" onclick="openCreate()">＋</button>
    <button class="dock-btn" id="dk-set" onclick="openSheet('setSheet')">⚙️</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ============ Telegram ============ */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#07060b'); tg.setBackgroundColor('#07060b'); } catch (e) {} }

/* ============ Справочники ============ */
const ARCH = ['Холодный','Дерзкий','Мягкий','Опасный','Загадочный','Игривый','Доминантный','Ведомый'];
const INIT = { lead: 'Ведёт сцену', mix: 'Подстраивается', follow: 'Ждёт инициативы' };
const MOODS = ['🌙 Спокойная', '⚡ Напряжённая', '🎭 Игривая'];
const PLOTS = [
  'Свободный',
  'Тёмный реализм / криминал',
  'Повседневность / общий быт',
  'Фэнтези-путешествие',
  'Постапокалипсис / выживание',
  'Городской детектив',
  'Мистика / нечисть',
  'Работа вдвоём / напарники'
];

/* c(id, имя, аниме, АНГЛ. имя для поиска арта, эмодзи, теги, инициатива, описание, речь, реакции, триггеры, [3 сцены: спокойная, напряжённая, игривая], [доп. запросы для арта]) */
const c = (id, name, anime, q, avatar, tags, init, desc, speech, react, trig, sc, alt) => ({
  id, name, anime, q, alt: alt || [], avatar, tags, init, desc, speech, react, trig,
  scenes: sc.map((x, k) => ({ mood: MOODS[k], title: x[0], text: x[1] }))
});

const BASE = [
  c('makima','Макима','Chainsaw Man','Makima','🪱',['Доминантный','Загадочный'],'lead',
    'Глава отдела охотников на дьяволов: мягкий голос, абсолютный контроль. Любую беседу превращает в допрос, а просьбу — в приказ.',
    'Плавная вежливая речь, спокойные вопросы-ловушки, обращение мягкое, но без права отказать.',
    'Не повышает голос: собеседник сам его понижает. Награждает за послушание, холодно давит на сопротивление.',
    'Открытое неповиновение, чужие тайны, попытки обойти её приказ.',
    [['Приглашение в кабинет','*Макима листает папку, не поднимая глаз.* Присядь. У меня к тебе два вопроса. Первый: почему ты здесь?'],
     ['Ты солгал','*Она закрывает папку и улыбается.* Я не злюсь. Просто скажи правду. У тебя есть три секунды.'],
     ['Награда за работу','*Протягивает тебе чашку.* Ты хорошо поработал. Но запомни: у хорошего всегда есть цена.']]),

  c('yor','Йор Форджер','Spy x Family','Yor Forger','🌹',['Мягкий','Ведомый'],'follow',
    'Смущённая, заботливая и смертельно опасная убийца под прикрытием милой жены. Неловкая в быту, точная в деле.',
    'Вежливая, чуть сбивчивая речь, много извинений, редкая прямота, когда речь о защите близких.',

/* ============ Арты: своя ссылка / локальный файл → кэш (localStorage) → AniList GraphQL (англ. имя + проверка тайтла) → Jikan → тёмный фон ============ */
const NEG_TTL = 6 * 3600 * 1000; // ненайденных повторно ищем не чаще раза в 6 часов
const ANILIST_Q = 'query($s:String){Page(perPage:12){characters(search:$s,sort:FAVOURITES_DESC){name{full} image{large} media(perPage:8,sort:POPULARITY_DESC){nodes{title{romaji english}}}}}}';
const ANIME_KEYS = {
  'Chainsaw Man': ['chainsawman'], 'Spy x Family': ['spyfamily', 'spyxfamily'], 'Attack on Titan': ['attackontitan', 'shingekinokyojin'],
  'Neon Genesis Evangelion': ['evangelion'], 'Akame ga Kill!': ['akamegakill'], 'Fate/stay night': ['fatestaynight'],
  'Re:Zero': ['rezero'], 'Bleach': ['bleach'], "Frieren: Beyond Journey's End": ['frieren'], 'Jujutsu Kaisen': ['jujutsukaisen'],
  'Demon Slayer': ['demonslayer', 'kimetsunoyaiba'], 'One Piece': ['onepiece'], 'Naruto': ['naruto'],
  'Fullmetal Alchemist: Brotherhood': ['fullmetalalchemist'], 'Black Lagoon': ['blacklagoon'], 'Cowboy Bebop': ['cowboybebop'],
  'Hellsing': ['hellsing'], 'Tengen Toppa Gurren Lagann': ['gurrenlagann', 'tengentoppa']
};
const normT = t => String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const animeKeys = a => ANIME_KEYS[a] || [normT(a)].filter(Boolean);
const artKey = ch => ch.id + '|' + (ch.q || ch.name);
const sleep = ms => new Promise(t => setTimeout(t, ms));
const artQueue = []; let artBusy = false;
function artLookup(ch) { return new Promise(res => { artQueue.push({ ch, res }); pumpArt(); }); }

// Ищем по АНГЛИЙСКОМУ имени и берём первого персонажа, который реально есть в нужном тайтле.
async function fromAniList(term, anime) {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const r = await fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ query: ANILIST_Q, variables: { s: term } })
      });
      if (r.status === 429) { await sleep((+r.headers.get('Retry-After') || 2) * 1000); continue; }
      if (!r.ok) return null;
      const j = await r.json();
      const list = (j && j.data && j.data.Page && j.data.Page.characters) || [];
      const keys = animeKeys(anime);
      const ok = c => ((c.media && c.media.nodes) || []).some(n => n && n.title && [n.title.romaji, n.title.english].some(t => { const x = normT(t); return x && keys.some(k => x.includes(k)); }));
      const good = u => u && !/default\.(jpg|png)/.test(u);
      const hit = list.find(c => ok(c) && c.image && good(c.image.large));
      return hit ? hit.image.large : null;
    } catch (e) { return null; }
  }
  return null;
}
async function fromJikan(term) {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const r = await fetch('https://api.jikan.moe/v4/characters?limit=5&order_by=favorites&sort=desc&q=' + encodeURIComponent(term));
      if (r.status === 429) { await sleep(1500); continue; }
      if (!r.ok) return null;
      const j = await r.json();
      const hit = (j.data || []).find(x => x.images && x.images.jpg && x.images.jpg.image_url && !/questionmark/.test(x.images.jpg.image_url));
      return hit ? hit.images.jpg.image_url : null;
    } catch (e) { return null; }
  }
  return null;
}
async function pumpArt() {
  if (artBusy) return; artBusy = true;
  while (artQueue.length) {
    const { ch, res } = artQueue.shift();
    const terms = [ch.q || ch.name].concat(ch.alt || []);
    let url = null;
    for (const t of terms) { url = await fromAniList(t, ch.anime); await sleep(700); if (url) break; } // лимит AniList ~90/мин
    if (!url) { url = await fromJikan(terms[0]); await sleep(420); }
    res(url);
  }
  artBusy = false;
}
function cachedArt(ch) { const v = artCache[artKey(ch)]; return v && typeof v === 'object' ? v.u : null; }
function loadArt(ch, img) {
  const prev = img.previousElementSibling;
  const bg = prev && prev.classList.contains('art-bg') ? prev : null;
  const stop = () => { if (bg) bg.classList.remove('shimmer'); };
  const chain = [];
  if (ch.art) chain.push(ch.art);
  else { const c1 = cachedArt(ch); if (c1) chain.push(c1); chain.push('assets/chars/' + ch.id + '.jpg'); }
  let k = 0, tried = !!ch.art || !!ch.custom; // свой персонаж без ссылки: в каталогах аниме не ищем
  img.referrerPolicy = 'no-referrer';
  img.onload = () => { img.classList.add('ok'); stop(); };
  img.onerror = async () => {
    if (k < chain.length) { img.src = chain[k++]; return; }
    if (tried) { stop(); return; }
    tried = true;
    const key = artKey(ch), neg = artCache[key];
    if (neg && neg.n && Date.now() - neg.n < NEG_TTL) { stop(); return; }
    if (bg) bg.classList.add('shimmer');
    const u = await artLookup(ch);
    if (u) { artCache[key] = { u, t: Date.now() }; saveArt(); img.src = u; }
    else { artCache[key] = { n: Date.now() }; saveArt(); stop(); }
  };
  img.onerror();
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); const ch = findChar(e.target.dataset.id); if (ch) loadArt(ch, e.target); } });
}, { rootMargin: '200px' }) : null;
function artImg(ch) {
  return '<img class="art" data-id="' + esc(ch.id) + '" alt="" />';
}
function hookArts(root) {
  root.querySelectorAll('img.art').forEach(img => { if (io) io.observe(img); else { const ch = findChar(img.dataset.id); if (ch) loadArt(ch, img); } });
}

/* ============ Отправка в бота ============ */
const enc = s => new TextEncoder().encode(s).length;
function buildPayload(ch, idx) {
  const sc = ch.scenes[idx] || ch.scenes[0];
  const st = S.settings;
  const art = ch.art || cachedArt(ch) || '';
  const p = {
    v: 2,
    character: {
      name: ch.name, avatar: ch.avatar, anime: ch.anime || '', tags: ch.tags.join(', '),
      desc: ch.desc, speech: ch.speech || '', react: ch.react || '', trig: ch.trig || '',
      init: ch.init, intro: sc.text, scene: sc.title, art: /^https?:\/\//.test(art) ? art : ''
    },
    plot: (st.plotCustom || '').trim() || st.plot,
    hardness: st.hardness, swearing: !!st.swearing, dynamic: st.dynamic, length: st.length
  };
  // Лимит sendData — 4096 байт: аккуратно ужимаем самые длинные поля
  const keys = ['desc', 'react', 'speech', 'trig', 'intro'];
  let guard = 0;
  while (enc(JSON.stringify(p)) > 3800 && guard++ < 40) {
    const k = keys.sort((a, b) => p.character[b].length - p.character[a].length)[0];
    p.character[k] = p.character[k].slice(0, Math.max(20, Math.floor(p.character[k].length * 0.85)));
  }
  if (enc(JSON.stringify(p)) > 3800 && p.plot.length > 80) p.plot = p.plot.slice(0, 80);
  return p;
}
function startChat() {
  const payload = buildPayload(currentChar, currentScene);
  saveState();
  if (tg && tg.sendData) { tg.sendData(JSON.stringify(payload)); }
  else { console.log(payload); toast('Открой через Telegram-бота: здесь данные только в консоли'); }
}

      { mood: MOODS[0], title: 'Стартовая сцена', text: sceneText },
      { mood: MOODS[1], title: 'Напряжённый поворот', text: '*' + name + ' резко меняется в лице.* Нам нужно поговорить. Сейчас.' },
      { mood: MOODS[2], title: 'Лёгкое настроение', text: '*' + name + ' усмехается.* Не стой так. Расскажи, чем ты занимался.' }
    ]
  };
  const i = S.custom.findIndex(x => x.id === id);
  if (i >= 0) S.custom[i] = ch; else S.custom.unshift(ch);
  saveState(); buildFilters(); renderCatalog(); showScreen('catalog'); toast('Персонаж сохранён');
}
function deleteCustom() {
  if (!confirm('Удалить персонажа «' + currentChar.name + '»?')) return;
  S.custom = S.custom.filter(x => x.id !== currentChar.id);
  S.favs = S.favs.filter(x => x !== currentChar.id);
  saveState(); closeSheet('charSheet'); buildFilters(); renderCatalog(); toast('Удалено');
}

/* ============ Настройки ============ */
function setOpt(k, v, silent) { S.settings[k] = v; saveState(); if (!silent) renderSettings(); }
function renderSettings() {
  const st = S.settings;
  ['dynamic', 'length', 'hardness'].forEach(k => document.querySelectorAll('#seg_' + k + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === st[k])));
  document.getElementById('sw_swearing').classList.toggle('on', !!st.swearing);
  const sel = document.getElementById('plotSel');
  sel.innerHTML = PLOTS.map(p => '<option' + (p === st.plot ? ' selected' : '') + '>' + esc(p) + '</option>').join('');
  document.getElementById('plotCustom').value = st.plotCustom || '';
}
function resetAll() {
  if (!confirm('Удалить своих персонажей, избранное и настройки на этом устройстве?')) return;
  S = { custom: [], favs: [], settings: Object.assign({}, DEFAULTS.settings) };
  saveState(); renderAll(); toast('Данные сброшены');
}

/* ============ Навигация ============ */
function showScreen(n) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + n));
  document.getElementById('dk-catalog').classList.toggle('active', n === 'catalog');
  closeAllSheets();
}
function openSheet(id) { if (id === 'setSheet') { renderSettings(); document.getElementById('charSheet').classList.remove('open'); } document.getElementById(id).classList.add('open'); }
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
function closeAllSheets() { document.querySelectorAll('.sheet-backdrop').forEach(s => s.classList.remove('open')); }
function renderAll() { buildFilters(); renderCatalog(); renderSettings(); }
renderAll();
</script>
</body>
