<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NOCTURNE RP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #060609;
      --panel: #0e0e14;
      --panel-2: #15151f;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(168, 85, 247, 0.45);
      --accent: #9333ea;
      --accent-soft: rgba(147, 51, 234, 0.18);
      --text: #f5f5f8;
      --muted: #9a99a8;
    }

    * {
      box-sizing: border-box;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(147, 51, 234, 0.14), transparent 50%),
        var(--bg);
      color: var(--text);
      padding: 12px 12px 92px 12px;
    }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.2s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .search-wrap {
      flex: 1;
      height: 38px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }

    .search-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s ease;
    }
    .chip.active {
      background: var(--accent-soft);
      border-color: var(--line-strong);
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .card {
      position: relative;
      height: 260px;
      border-radius: 18px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }
    .card:active { transform: scale(0.98); }
    .card:hover { border-color: rgba(255, 255, 255, 0.24); }

    .card-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
      background: linear-gradient(180deg, #171426, #08080d);
    }

    .card-grad {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(6, 6, 9, 0.08) 0%,
        rgba(6, 6, 9, 0.2) 45%,
        rgba(6, 6, 9, 0.96) 92%
      );
      pointer-events: none;
    }

    .card-top {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .role-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(6, 6, 9, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      text-transform: uppercase;
    }
    .role-tag.dom { color: #fda4af; border-color: rgba(225, 29, 72, 0.5); }
    .role-tag.sub { color: #d8b4fe; border-color: rgba(168, 85, 247, 0.5); }
    .role-tag.brat { color: #fcd34d; border-color: rgba(245, 158, 11, 0.5); }

    .anime-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(6, 6, 9, 0.75);
      color: #c7c6d4;
      border: 1px solid rgba(255,255,255,0.08);
      max-width: 96px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-body {
      position: relative;
      z-index: 2;
    }

    .card-body h4 {
      margin: 0 0 3px 0;
      font-size: 15px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }

    .card-body p {
      margin: 0;
      font-size: 11px;
      color: #c7c6d4;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .create-card .create-bg {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.14) 1px, transparent 1px),
        linear-gradient(180deg, #151221, #060609);
      background-size: 16px 16px, 100% 100%;
    }

    .dock {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 58px;
      border-radius: 18px;
      background: rgba(14, 14, 20, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
    }

    .dock-item {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .dock-item.active {
      color: var(--text);
      background: var(--accent-soft);
    }

    .dock-add {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .hero-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }

    .hero-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .hero-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .room-ava-frame {
      width: 48px;
      height: 56px;
      border-radius: 12px;
      background: var(--panel-2);
      border: 1px solid var(--line-strong);
      overflow: hidden;
      flex-shrink: 0;
    }
    .room-ava-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .hero-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hero-sub {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scene-picker {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .picker-hero {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .picker-ava {
      width: 82px;
      height: 104px;
      border-radius: 14px;
      background: var(--panel-2);
      border: 1px solid var(--line-strong);
      overflow: hidden;
      flex-shrink: 0;
    }
    .picker-ava img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    .scene-picker h3 {
      margin: 0 0 4px 0;
      font-size: 16px;
    }
    .scene-picker p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .plot-option {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .plot-option:hover { border-color: var(--line-strong); }
    .plot-option-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .plot-option-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-ghost {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .chat-stream {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 84px;
    }

    .bubble {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.42;
      white-space: pre-wrap;
    }
    .bubble.bot {
      background: var(--panel);
      border: 1px solid var(--line);
      align-self: flex-start;
    }
    .bubble.user {
      background: var(--accent-soft);
      border: 1px solid var(--line-strong);
      align-self: flex-end;
    }

    .composer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(6, 6, 9, 0.95);
      border-top: 1px solid var(--line);
      padding: 8px 12px 12px 12px;
      z-index: 40;
    }

    .composer-box {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 4px 6px 4px 12px;
      margin-bottom: 8px;
    }
    .composer-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      padding: 6px 0;
    }
    .send-ic {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .tools-row {
      display: flex;
      gap: 6px;
    }
    .tool-pill {
      height: 30px;
      padding: 0 10px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .tool-pill.on {
      color: var(--text);
      border-color: var(--line-strong);
      background: var(--accent-soft);
    }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 80;
      align-items: flex-end;
    }
    .backdrop.open { display: flex; }

    .sheet {
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--panel);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-top: 1px solid var(--line);
      padding: 10px 16px 22px 16px;
    }
    .grip {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      margin: 0 auto 12px auto;
    }
    .sheet h3 { margin: 0 0 12px 0; font-size: 17px; }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 10px 0 5px 0;
    }
    input, textarea, select {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
    }
    textarea { min-height: 70px; }

    .opt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      font-size: 14px;
    }
    .opt-val { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>

  <div class="screen active" id="screen-catalog">
    <div class="top-bar">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b8a99" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="q" placeholder="Поиск персонажа, аниме или характера..." oninput="renderGrid()" />
      </div>
      <button class="icon-btn" onclick="openCreate()" title="Создать персонажа">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>

    <div class="chips">
      <button class="chip active" onclick="setFilter('all', this)">Все</button>
      <button class="chip" onclick="setFilter('dom', this)">Доминирующие</button>
      <button class="chip" onclick="setFilter('sub', this)">Не доминирующие</button>
      <button class="chip" onclick="setFilter('brat', this)">Дерзкие</button>
      <button class="chip" onclick="setFilter('custom', this)">Мои</button>
    </div>

    <div class="grid" id="grid"></div>

    <nav class="dock">
      <button class="dock-item active" onclick="showCatalog()" title="Каталог">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
          <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
        </svg>
      </button>
      <button class="dock-item" onclick="openActiveOrFirst()" title="Активный диалог">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
      <button class="dock-add" onclick="openCreate()" title="Создать персонажа">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button class="dock-item" onclick="openStyle()" title="Стиль и тон">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </nav>
  </div>

  <div class="screen" id="screen-room">
    <div class="hero-bar">
      <div class="hero-left">
        <button class="icon-btn" onclick="showCatalog()" title="Назад">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <div class="room-ava-frame" id="room-ava"></div>
        <div style="min-width:0;">
          <div class="hero-title" id="room-name">Имя</div>
          <div class="hero-sub" id="room-sub">Характер и сцена</div>
        </div>
      </div>
      <div class="hero-actions">
        <button class="icon-btn" onclick="cycleCharArt()" title="Другой арт персонажа">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
          </svg>
        </button>
        <button class="icon-btn" onclick="resetRoom()" title="Сбросить сцену">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="scene-picker" id="scene-picker">
      <div class="picker-hero">
        <div class="picker-ava" id="picker-ava"></div>
        <div>
          <h3 id="picker-title">Сценарий для персонажа</h3>
          <p id="picker-desc">Выбери сюжет под её характер или напиши свой ход сразу внизу.</p>
        </div>
      </div>
      <div id="picker-plots"></div>
      <button class="btn-ghost" onclick="openCustomPlotForChar()">+ Свой сюжет для этого диалога</button>
    </div>

    <div class="chat-stream" id="chat-stream"></div>

    <div class="composer">
      <div class="composer-box">
        <input id="chat-input" placeholder="Напиши действие или реплику..." onkeydown="if(event.key==='Enter') sendChat()" />
        <button class="send-ic" onclick="sendChat()" title="Отправить">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
          </svg>
        </button>
      </div>
      <div class="tools-row">
        <button class="tool-pill on" id="pill-mode" onclick="toggleDominance()">Доминация: Авто</button>
        <button class="tool-pill" onclick="openStyle()">Стиль</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="backdrop-create" onclick="if(event.target===this) closeAll()">
    <div class="sheet">
      <div class="grip"></div>
      <h3>Новый персонаж</h3>
      <label>Имя персонажа (на англ. или рус. для поиска арта в AniList)</label>
      <input id="c-name" placeholder="Например: Makima или Эсдес" />
      <label>Аниме / тайтл (необязательно)</label>
      <input id="c-anime" placeholder="Например: Chainsaw Man" />
      <label>Характер / динамика</label>
      <select id="c-vibe">
        <option value="dom">Доминирующая</option>
        <option value="sub">Не доминирующая (мягкая / ведомая)</option>
        <option value="brat">Дерзкая / колкая</option>
      </select>
      <label>Прямая ссылка на картинку (необязательно)</label>
      <input id="c-img" placeholder="https://..." />
      <label>Описание характера</label>
      <textarea id="c-desc" placeholder="Как общается, кто ведёт сцену, детали образа..."></textarea>
      <label>Стартовый сюжет</label>
      <textarea id="c-plot" placeholder="С чего начинается ваша сцена..."></textarea>
      <button class="btn-primary" style="margin-top:12px;" onclick="saveCustomChar()">Сохранить и открыть</button>
    </div>
  </div>

  <div class="backdrop" id="backdrop-style" onclick="if(event.target===this) closeAll()">
    <div class="sheet">
      <div class="grip"></div>
      <h3>Стиль отыгрыша</h3>
      <div class="opt-row" onclick="cycleCfg('format', ['Действия в *звёздочках*', 'Только диалог', 'Смешанный'])">
        <span>Формат</span>
        <span class="opt-val" id="cfg-format">Действия в *звёздочках*</span>
      </div>
      <div class="opt-row" onclick="cycleCfg('slang', ['Живой / мат ок', 'Жёсткий', 'Без мата'])">
        <span>Речь и лексика</span>
        <span class="opt-val" id="cfg-slang">Живой / мат ок</span>
      </div>
      <div class="opt-row" onclick="cycleCfg('pov', ['От 1-го лица', 'От 2-го лица', 'От 3-го лица'])">
        <span>POV</span>
        <span class="opt-val" id="cfg-pov">От 1-го лица</span>
      </div>
      <button class="btn-primary" style="margin-top:14px;" onclick="closeAll()">Готово</button>
    </div>
  </div>

  <div class="backdrop" id="backdrop-plot" onclick="if(event.target===this) closeAll()">
    <div class="sheet">
      <div class="grip"></div>
      <h3>Свой сюжет</h3>
      <label>Название сцены</label>
      <input id="p-title" placeholder="Например: Ночной разговор у окна" />
      <label>Завязка</label>
      <textarea id="p-text" placeholder="Опиши место и ситуацию..."></textarea>
      <button class="btn-primary" style="margin-top:12px;" onclick="applyCustomPlot()">Запустить сцену</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const characters = [
      {
        id: "esdeath",
        name: "Эсдес",
        queryName: "Esdeath",
        anime: "Akame ga Kill!",
        vibe: "dom",
        roleLabel: "Доминирующая",
        desc: "Холодная, властная и расчётливая. Берёт инициативу в свои руки и диктует правила сцены.",
        plots: [
          { title: "Приказ в пустом кабинете", text: "Поздний вечер, она медленно поворачивается к тебе с ледяным спокойствием и не оставляет выбора." },
          { title: "Проверка на прочность", text: "Закрытая дверь и прямой взгляд: ей нужны действия, а не оправдания." }
        ]
      },
      {
        id: "olivier",
        name: "Оливье Армстронг",
        queryName: "Olivier Mira Armstrong",
        anime: "Fullmetal Alchemist",
        vibe: "dom",
        roleLabel: "Доминирующая",
        desc: "Уверенная, жёсткая и прямолинейная. Привыкла контролировать ситуацию и не терпит слабины.",
        plots: [
          { title: "Разговор без лишних слов", text: "Она садится на край стола и спокойно смотрит сверху вниз, проверяя твои нервы." },
          { title: "Жёсткие условия", text: "Правила заданы заранее, и именно она решает, как пойдёт дальше сцена." }
        ]
      },
      {
        id: "violet",
        name: "Вайолет Эвергарден",
        queryName: "Violet Evergarden",
        anime: "Violet Evergarden",
        vibe: "sub",
        roleLabel: "Не доминирующая",
        desc: "Сдержанная, внимательная и податливая. Ждёт твоего решения и чётко следует за твоим ходом.",
        plots: [
          { title: "Тихий вечер за письмами", text: "На столе лампа и чистые листы; она внимательно ждёт, что ты скажешь первым." },
          { title: "Спокойный разговор", text: "Приглушённый свет, ровная тишина — она полностью полагается на твою инициативу." }
        ]
      },
      {
        id: "holo",
        name: "Холо",
        queryName: "Holo",
        anime: "Spice and Wolf",
        vibe: "sub",
        roleLabel: "Не доминирующая",
        desc: "Утончённая, мягкая и наблюдательная. Рядом с надёжным партнёром легко уступает лидерство.",
        plots: [
          { title: "Поздний ужин на двоих", text: "В комнате тепло и тихо; она поправляет рукав и спокойно смотрит на тебя, ожидая твоего шага." },
          { title: "После долгой дороги", text: "Усталость позади, она присаживается рядом и тихо ждёт твоего решения." }
        ]
      },
      {
        id: "marin",
        name: "Марин Китагава",
        queryName: "Marin Kitagawa",
        anime: "My Dress-Up Darling",
        vibe: "brat",
        roleLabel: "Дерзкая",
        desc: "Яркая, живая и прямолинейная. Подкалывает, шутит, но быстро становится искренней.",
        plots: [
          { title: "Примерка нового образа", text: "В комнате разложены ткани и реквизит, Марин смотрит на тебя с лёгкой ухмылкой и ждёт реакции." },
          { title: "Полночный разговор", text: "Пустая кухня, два напитка и долгие разговоры до утра." }
        ]
      },
      {
        id: "rin",
        name: "Рин Тосака",
        queryName: "Rin Tohsaka",
        anime: "Fate/stay night",
        vibe: "brat",
        roleLabel: "Дерзкая",
        desc: "Колкая и гордая снаружи, но легко выдаёт эмоции, когда её задевают за живое.",
        plots: [
          { title: "Ночь в старом особняке", text: "Рин скрещивает руки и бросает вызов с насмешкой: «И что ты собираешься делать дальше?»" }
        ]
      }
    ];

    const artCache = JSON.parse(localStorage.getItem("nocturne_anilist_arts") || "{}");
    const artIndexMap = {};

    let currentFilter = "all";
    let activeChar = null;
    let activePlot = null;
    let history = [];
    let domOverride = "auto";

    const cfg = {
      format: "Действия в *звёздочках*",
      slang: "Живой / мат ок",
      pov: "От 1-го лица"
    };

    function allChars() {
      const custom = JSON.parse(localStorage.getItem("nocturne_custom_chars") || "[]");
      return [...characters, ...custom];
    }

    async function fetchAniListArts(char) {
      const cacheKey = `${char.queryName || char.name}__${char.anime || ""}`.toLowerCase();
      if (artCache[cacheKey]?.length) return artCache[cacheKey];

      const query = `
        query ($search: String) {
          Character(search: $search) {
            name { full }
            image { large medium }
            media(perPage: 3) {
              nodes {
                title { english romaji }
                coverImage { extraLarge large }
              }
            }
          }
        }
      `;

      try {
        const res = await fetch("https://graphql.anilist.co", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ query, variables: { search: char.queryName || char.name } })
        });
        const json = await res.json();
        const character = json?.data?.Character;
        const urls = [];
        if (character?.image?.large) urls.push(character.image.large);
        if (character?.image?.medium) urls.push(character.image.medium);
        (character?.media?.nodes || []).forEach(m => {
          if (m?.coverImage?.extraLarge) urls.push(m.coverImage.extraLarge);
          if (m?.coverImage?.large) urls.push(m.coverImage.large);
        });

        const unique = [...new Set(urls.filter(Boolean))];
        if (unique.length) {
          artCache[cacheKey] = unique;
          localStorage.setItem("nocturne_anilist_arts", JSON.stringify(artCache));
        }
        return unique;
      } catch {
        return [];
      }
    }

    function getCurrentCharArt(char) {
      if (char.customImg) return char.customImg;
      const cacheKey = `${char.queryName || char.name}__${char.anime || ""}`.toLowerCase();
      const list = artCache[cacheKey] || [];
      if (!list.length) return "";
      const idx = artIndexMap[char.id] || 0;
      return list[idx % list.length];
    }

    async function hydrateCardArt(char, imgEl) {
      if (char.customImg) {
        imgEl.src = char.customImg;
        return;
      }
      const cached = getCurrentCharArt(char);
      if (cached) {
        imgEl.src = cached;
        return;
      }
      const urls = await fetchAniListArts(char);
      if (urls.length && imgEl.isConnected) {
        imgEl.src = urls[0];
      }
    }

    async function cycleCharArt() {
      if (!activeChar) return;
      if (activeChar.customImg) return;
      const urls = await fetchAniListArts(activeChar);
      if (!urls.length) return;
      artIndexMap[activeChar.id] = ((artIndexMap[activeChar.id] || 0) + 1) % urls.length;
      const nextUrl = getCurrentCharArt(activeChar);
      document.querySelectorAll("#room-ava img, #picker-ava img").forEach(img => {
        img.src = nextUrl;
      });
      renderGrid();
    }

    function setFilter(f, el) {
      currentFilter = f;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      renderGrid();
    }

    function renderGrid() {
      const q = (document.getElementById("q").value || "").trim().toLowerCase();
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      const createTile = document.createElement("div");
      createTile.className = "card create-card";
      createTile.onclick = openCreate;
      createTile.innerHTML = `
        <div class="create-bg">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="1.8">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </div>
        <div class="card-grad"></div>
        <div class="card-top"><span class="role-tag">Свой</span></div>
        <div class="card-body">
          <h4>Создать персонажа</h4>
          <p>Имя из аниме, характер, доминация или мягкость и свой старт.</p>
        </div>
      `;
      grid.appendChild(createTile);

      const list = allChars().filter(c => {
        if (currentFilter === "custom" && !c.custom) return false;
        if (["dom", "sub", "brat"].includes(currentFilter) && c.vibe !== currentFilter) return false;
        if (!q) return true;
        return (
          c.name.toLowerCase().includes(q) ||
          (c.anime || "").toLowerCase().includes(q) ||
          c.desc.toLowerCase().includes(q) ||
          c.roleLabel.toLowerCase().includes(q)
        );
      });

      list.forEach(c => {
        const tile = document.createElement("div");
        tile.className = "card";
        tile.onclick = () => openChar(c);
        const initialArt = getCurrentCharArt(c);
        tile.innerHTML = `
          <img class="card-art" src="${initialArt}" alt="${c.name}" loading="lazy" />
          <div class="card-grad"></div>
          <div class="card-top">
            <span class="role-tag ${c.vibe}">${c.roleLabel}</span>
            ${c.anime ? `<span class="anime-tag">${c.anime}</span>` : ""}
          </div>
          <div class="card-body">
            <h4>${c.name}</h4>
            <p>${c.desc}</p>
          </div>
        `;
        const imgEl = tile.querySelector("img.card-art");
        hydrateCardArt(c, imgEl);
        grid.appendChild(tile);
      });
    }

    async function openChar(c) {
      activeChar = c;
      activePlot = null;
      history = [];
      domOverride = "auto";
      updateDomPill();

      const artUrl = getCurrentCharArt(c);
      document.getElementById("room-ava").innerHTML = `<img src="${artUrl}" alt="${c.name}" />`;
      document.getElementById("picker-ava").innerHTML = `<img src="${artUrl}" alt="${c.name}" />`;

      if (!artUrl && !c.customImg) {
        const urls = await fetchAniListArts(c);
        if (urls.length && activeChar?.id === c.id) {
          document.querySelectorAll("#room-ava img, #picker-ava img").forEach(img => {
            img.src = urls[0];
          });
        }
      }

      document.getElementById("room-name").textContent = c.name;
      document.getElementById("room-sub").textContent = `${c.roleLabel}${c.anime ? " · " + c.anime : ""}`;
      document.getElementById("picker-title").textContent = `${c.name} · ${c.roleLabel}`;
      document.getElementById("picker-desc").textContent = c.desc;

      const plotsBox = document.getElementById("picker-plots");
      plotsBox.innerHTML = "";
      (c.plots || []).forEach(p => {
        const div = document.createElement("div");
        div.className = "plot-option";
        div.onclick = () => startPlot(p);
        div.innerHTML = `
          <div class="plot-option-head"><span>${p.title}</span><span>→</span></div>
          <div class="plot-option-desc">${p.text}</div>
        `;
        plotsBox.appendChild(div);
      });

      document.getElementById("scene-picker").style.display = "block";
      document.getElementById("chat-stream").innerHTML = "";
      switchScreen("screen-room");
    }

    function startPlot(p) {
      activePlot = p;
      document.getElementById("scene-picker").style.display = "none";
      document.getElementById("room-sub").textContent = `${activeChar.roleLabel} · ${p.title}`;
      addBubble("bot", `*${p.title}.* ${p.text}`);
    }

    function resetRoom() {
      if (!activeChar) return;
      openChar(activeChar);
    }

    function addBubble(role, text) {
      history.push({ role, text });
      const stream = document.getElementById("chat-stream");
      const el = document.createElement("div");
      el.className = "bubble " + role;
      el.textContent = text;
      stream.appendChild(el);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function sendChat() {
      const inp = document.getElementById("chat-input");
      const text = inp.value.trim();
      if (!text) return;
      if (!activeChar) activeChar = allChars()[0];

      if (document.getElementById("scene-picker").style.display !== "none") {
        document.getElementById("scene-picker").style.display = "none";
      }

      inp.value = "";
      addBubble("user", text);

      const effectiveVibe = domOverride === "auto" ? activeChar.vibe : domOverride;
      let reply = "";
      if (effectiveVibe === "dom") {
        reply = `*${activeChar.name} смотрит на тебя спокойно и уверенно, не уступая инициативы.* «${text}» — звучит интересно. Посмотрим, как ты поведёшь себя дальше.`;
      } else if (effectiveVibe === "sub") {
        reply = `*${activeChar.name} слегка опускает взгляд, но быстро поднимает его на тебя, готовая подстроиться.* Хорошо… как скажешь насчёт «${text}»?`;
      } else {
        reply = `*${activeChar.name} усмехается и кивает с лёгким вызовом.* Ну-ну, «${text}». И что ты собираешься делать дальше?`;
      }

      setTimeout(() => addBubble("bot", reply), 220);
    }

    function toggleDominance() {
      const order = ["auto", "dom", "sub"];
      domOverride = order[(order.indexOf(domOverride) + 1) % order.length];
      updateDomPill();
    }

    function updateDomPill() {
      const btn = document.getElementById("pill-mode");
      const labels = {
        auto: "Доминация: Авто",
        dom: "Доминация: Вкл",
        sub: "Доминация: Выкл"
      };
      btn.textContent = labels[domOverride];
      btn.classList.toggle("on", domOverride !== "auto");
    }

    function openCreate() { closeAll(); document.getElementById("backdrop-create").classList.add("open"); }
    function openStyle() { closeAll(); document.getElementById("backdrop-style").classList.add("open"); }
    function openCustomPlotForChar() {
      if (!activeChar) return;
      closeAll();
      document.getElementById("backdrop-plot").classList.add("open");
    }

    function applyCustomPlot() {
      const title = document.getElementById("p-title").value.trim() || "Свой сюжет";
      const text = document.getElementById("p-text").value.trim() || "Сцена начинается.";
      document.getElementById("p-title").value = "";
      document.getElementById("p-text").value = "";
      closeAll();
      startPlot({ title, text });
    }

    function saveCustomChar() {
      const name = document.getElementById("c-name").value.trim();
      const anime = document.getElementById("c-anime").value.trim();
      const vibe = document.getElementById("c-vibe").value;
      const customImg = document.getElementById("c-img").value.trim();
      const desc = document.getElementById("c-desc").value.trim() || "Свой персонаж.";
      const plotText = document.getElementById("c-plot").value.trim() || "Сцена начинается.";
      if (!name) return alert("Укажи имя");

      const labels = { dom: "Доминирующая", sub: "Не доминирующая", brat: "Дерзкая" };
      const item = {
        id: "custom_" + Date.now(),
        name,
        queryName: name,
        anime,
        vibe,
        roleLabel: labels[vibe],
        desc,
        custom: true,
        customImg: customImg || "",
        plots: [{ title: "Стартовая сцена", text: plotText }]
      };

      const custom = JSON.parse(localStorage.getItem("nocturne_custom_chars") || "[]");
      custom.push(item);
      localStorage.setItem("nocturne_custom_chars", JSON.stringify(custom));

      document.getElementById("c-name").value = "";
      document.getElementById("c-anime").value = "";
      document.getElementById("c-img").value = "";
      document.getElementById("c-desc").value = "";
      document.getElementById("c-plot").value = "";
      closeAll();
      openChar(item);
    }

    function cycleCfg(key, arr) {
      cfg[key] = arr[(arr.indexOf(cfg[key]) + 1) % arr.length];
      document.getElementById("cfg-" + key).textContent = cfg[key];
    }

    function closeAll() {
      document.querySelectorAll(".backdrop").forEach(b => b.classList.remove("open"));
    }

    function switchScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function showCatalog() {
      switchScreen("screen-catalog");
      renderGrid();
    }

    function openActiveOrFirst() {
      if (activeChar) {
        switchScreen("screen-room");
      } else {
        openChar(allChars()[0]);
      }
    }

    renderGrid();
  </script>
</body>
</html>
