<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NOCTURNE RP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #060609;
      --panel: #0e0e14;
      --panel-2: #15151f;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(168, 85, 247, 0.45);
      --accent: #9333ea;
      --accent-soft: rgba(147, 51, 234, 0.18);
      --text: #f5f5f8;
      --muted: #8b8a99;
    }

    * {
      box-sizing: border-box;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(147, 51, 234, 0.14), transparent 50%),
        var(--bg);
      color: var(--text);
      padding: 12px 12px 92px 12px;
    }

    /* Анимации иконок и аватаров */
    .anim-float {
      animation: floatY 3s ease-in-out infinite;
    }
    .anim-pulse {
      animation: pulseGlow 2.4s ease-in-out infinite;
    }
    .anim-tilt {
      animation: tiltSoft 3.6s ease-in-out infinite;
      transform-origin: center;
    }
    .anim-spin-slow {
      animation: spinSlow 9s linear infinite;
      transform-origin: center;
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes tiltSoft {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.2s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .search-wrap {
      flex: 1;
      height: 38px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }

    .search-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s ease;
    }
    .chip.active {
      background: var(--accent-soft);
      border-color: var(--line-strong);
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .card {
      position: relative;
      height: 236px;
      border-radius: 16px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }
    .card:active { transform: scale(0.98); }
    .card:hover { border-color: rgba(255, 255, 255, 0.22); }

    .card-bg {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding-bottom: 34px;
      background: radial-gradient(circle at 50% 34%, rgba(168, 85, 247, 0.14), transparent 65%);
    }

    .card-grad {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 34%, rgba(6, 6, 9, 0.96) 100%);
    }

    .card-top {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .role-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(6, 6, 9, 0.82);
      border: 1px solid var(--line);
      text-transform: uppercase;
    }
    .role-tag.dom { color: #fda4af; border-color: rgba(225, 29, 72, 0.45); }
    .role-tag.sub { color: #d8b4fe; border-color: rgba(168, 85, 247, 0.45); }
    .role-tag.brat { color: #fcd34d; border-color: rgba(245, 158, 11, 0.45); }

    .card-body {
      position: relative;
      z-index: 2;
    }

    .card-body h4 {
      margin: 0 0 3px 0;
      font-size: 14px;
      font-weight: 700;
    }

    .card-body p {
      margin: 0;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .create-card .card-bg {
      padding-bottom: 0;
      background:
        radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1px),
        linear-gradient(180deg, #111118, #060609);
      background-size: 16px 16px, 100% 100%;
    }

    .dock {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 58px;
      border-radius: 18px;
      background: rgba(14, 14, 20, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
    }

    .dock-item {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .dock-item.active {
      color: var(--text);
      background: var(--accent-soft);
    }

    .dock-add {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .hero-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }

    .hero-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .room-ava-frame {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--panel-2);
      border: 1px solid var(--line-strong);
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .hero-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hero-sub {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scene-picker {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .picker-hero {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .picker-ava {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .scene-picker h3 {
      margin: 0 0 3px 0;
      font-size: 16px;
    }
    .scene-picker p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .plot-option {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .plot-option:hover { border-color: var(--line-strong); }
    .plot-option-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .plot-option-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-ghost {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .chat-stream {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 84px;
    }

    .bubble {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.42;
      white-space: pre-wrap;
    }
    .bubble.bot {
      background: var(--panel);
      border: 1px solid var(--line);
      align-self: flex-start;
    }
    .bubble.user {
      background: var(--accent-soft);
      border: 1px solid var(--line-strong);
      align-self: flex-end;
    }

    .composer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(6, 6, 9, 0.95);
      border-top: 1px solid var(--line);
      padding: 8px 12px 12px 12px;
      z-index: 40;
    }

    .composer-box {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 4px 6px 4px 12px;
      margin-bottom: 8px;
    }
    .composer-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      padding: 6px 0;
    }
    .send-ic {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .tools-row {
      display: flex;
      gap: 6px;
    }
    .tool-pill {
      height: 30px;
      padding: 0 10px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .tool-pill.on {
      color: var(--text);
      border-color: var(--line-strong);
      background: var(--accent-soft);
    }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 80;
      align-items: flex-end;
    }
    .backdrop.open { display: flex; }

    .sheet {
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--panel);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-top: 1px solid var(--line);
      padding: 10px 16px 22px 16px;
    }
    .grip {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      margin: 0 auto 12px auto;
    }
    .sheet h3 { margin: 0 0 12px 0; font-size: 17px; }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 10px 0 5px 0;
    }
    input, textarea, select {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
    }
    textarea { min-height: 70px; }

    .opt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      font-size: 14px;
    }
    .opt-val { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>

  <div class="screen active" id="screen-catalog">
    <div class="top-bar">
      <div class="search-wrap">
        <svg class="anim-pulse" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b8a99" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="q" placeholder="Поиск персонажа или характера..." oninput="renderGrid()" />
      </div>
      <button class="icon-btn" onclick="openCreate()" title="Создать персонажа">
        <svg class="anim-float" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>

    <div class="chips">
      <button class="chip active" onclick="setFilter('all', this)">Все</button>
      <button class="chip" onclick="setFilter('dom', this)">Доминирующие</button>
      <button class="chip" onclick="setFilter('sub', this)">Не доминирующие</button>
      <button class="chip" onclick="setFilter('brat', this)">Дерзкие</button>
      <button class="chip" onclick="setFilter('custom', this)">Мои</button>
    </div>

    <div class="grid" id="grid"></div>

    <nav class="dock">
      <button class="dock-item active" onclick="showCatalog()" title="Каталог">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
          <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
        </svg>
      </button>
      <button class="dock-item" onclick="openActiveOrFirst()" title="Активный диалог">
        <svg class="anim-float" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
      <button class="dock-add" onclick="openCreate()" title="Создать персонажа">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button class="dock-item" onclick="openStyle()" title="Стиль и тон">
        <svg class="anim-spin-slow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </nav>
  </div>

  <div class="screen" id="screen-room">
    <div class="hero-bar">
      <div class="hero-left">
        <button class="icon-btn" onclick="showCatalog()" title="Назад">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <div class="room-ava-frame" id="room-ava"></div>
        <div style="min-width:0;">
          <div class="hero-title" id="room-name">Имя</div>
          <div class="hero-sub" id="room-sub">Характер и сцена</div>
        </div>
      </div>
      <button class="icon-btn" onclick="resetRoom()" title="Сбросить сцену">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
        </svg>
      </button>
    </div>

    <div class="scene-picker" id="scene-picker">
      <div class="picker-hero">
        <div class="picker-ava" id="picker-ava"></div>
        <div>
          <h3 id="picker-title">Сценарий для персонажа</h3>
          <p id="picker-desc">Выбери сюжет под её характер или напиши свой ход сразу внизу.</p>
        </div>
      </div>
      <div id="picker-plots"></div>
      <button class="btn-ghost" onclick="openCustomPlotForChar()">+ Свой сюжет для этого диалога</button>
    </div>

    <div class="chat-stream" id="chat-stream"></div>

    <div class="composer">
      <div class="composer-box">
        <input id="chat-input" placeholder="Напиши действие или реплику..." onkeydown="if(event.key==='Enter') sendChat()" />
        <button class="send-ic" onclick="sendChat()" title="Отправить">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
          </svg>
        </button>
      </div>
      <div class="tools-row">
        <button class="tool-pill on" id="pill-mode" onclick="toggleDominance()">Доминация: Авто</button>
        <button class="tool-pill" onclick="requestSceneArt()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
          </svg>
          Арт
        </button>
        <button class="tool-pill" onclick="openStyle()">Стиль</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="backdrop-create" onclick="if(event.target===this) closeAll()">
    <div class="sheet">
      <div class="grip"></div>
      <h3>Новый персонаж</h3>
      <label>Имя</label>
      <input id="c-name" placeholder="Например: Аврора" />
      <label>Характер / динамика</label>
      <select id="c-vibe">
        <option value="dom">Доминирующая</option>
        <option value="sub">Не доминирующая (мягкая / ведомая)</option>
        <option value="brat">Дерзкая / колкая</option>
      </select>
      <label>Описание характера и внешности</label>
      <textarea id="c-desc" placeholder="Как общается, кто ведёт сцену, детали образа..."></textarea>
      <label>Стартовый сюжет</label>
      <textarea id="c-plot" placeholder="С чего начинается ваша сцена..."></textarea>
      <button class="btn-primary" style="margin-top:12px;" onclick="saveCustomChar()">Сохранить и открыть</button>
    </div>
  </div>

  <div class="backdrop" id="backdrop-style" onclick="if(event.target===this) closeAll()">
    <div class="sheet">
      <div class="grip"></div>
      <h3>Стиль отыгрыша</h3>
      <div class="opt-row" onclick="cycleCfg('format', ['Действия в *звёздочках*', 'Только диалог', 'Смешанный'])">
        <span>Формат</span>
        <span class="opt-val" id="cfg-format">Действия в *звёздочках*</span>
      </div>
      <div class="opt-row" onclick="cycleCfg('slang', ['Живой / мат ок', 'Жёсткий', 'Без мата'])">
        <span>Речь и лексика</span>
        <span class="opt-val" id="cfg-slang">Живой / мат ок</span>
      </div>
      <div class="opt-row" onclick="cycleCfg('pov', ['От 1-го лица', 'От 2-го лица', 'От 3-го лица'])">
        <span>POV</span>
        <span class="opt-val" id="cfg-pov">От 1-го лица</span>
      </div>
      <button class="btn-primary" style="margin-top:14px;" onclick="closeAll()">Готово</button>
    </div>
  </div>

  <div class="backdrop" id="backdrop-plot" onclick="if(event.target===this) closeAll()">
    <div class="sheet">
      <div class="grip"></div>
      <h3>Свой сюжет</h3>
      <label>Название сцены</label>
      <input id="p-title" placeholder="Например: Ночной разговор у окна" />
      <label>Завязка</label>
      <textarea id="p-text" placeholder="Опиши место и ситуацию..."></textarea>
      <button class="btn-primary" style="margin-top:12px;" onclick="applyCustomPlot()">Запустить сцену</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    /* Индивидуальные анимированные SVG-аватары под каждого персонажа */
    function renderCharAvatar(id, vibe, size = 84) {
      const portraits = {
        veronika: `
          <svg class="anim-float" width="${size}" height="${size}" viewBox="0 0 96 96" fill="none">
            <circle cx="48" cy="48" r="42" fill="#230b16" stroke="#fb7185" stroke-width="1.8" stroke-opacity="0.5"/>
            <path d="M22 44c2-20 14-28 26-28s24 8 26 28l3 24H19l3-24Z" fill="#3b0d1e"/>
            <circle cx="48" cy="48" r="18" fill="#fde2e4"/>
            <path d="M30 43c5-11 26-13 36 0-5-5-11-7-18-7s-13 2-18 7Z" fill="#1f0812"/>
            <path class="anim-pulse" d="M36 48l5-2 5 2M50 48l5-2 5 2" stroke="#9f1239" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M43 57c3 2 7 2 10 0" stroke="#be123c" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M32 76c4-8 10-11 16-11s12 3 16 11" fill="#881337"/>
          </svg>`,
        rina: `
          <svg class="anim-tilt" width="${size}" height="${size}" viewBox="0 0 96 96" fill="none">
            <circle cx="48" cy="48" r="42" fill="#1c0d2b" stroke="#e879f9" stroke-width="1.8" stroke-opacity="0.5"/>
            <path d="M24 38c4-16 16-23 24-23s20 7 24 23l-6 26H30l-6-26Z" fill="#4a1568"/>
            <circle cx="48" cy="48" r="18" fill="#fae8ff"/>
            <path d="M34 47h9M53 47h9" stroke="#581c87" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M42 57c4 2.5 8 1.5 11-1" stroke="#a21caf" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M31 76c4-8 10-11 17-11s13 3 17 11" fill="#701a75"/>
          </svg>`,
        miya: `
          <svg class="anim-float" width="${size}" height="${size}" viewBox="0 0 96 96" fill="none">
            <circle cx="48" cy="48" r="42" fill="#151029" stroke="#c4b5fd" stroke-width="1.8" stroke-opacity="0.5"/>
            <path d="M25 46c0-15 10-27 23-27s23 12 23 27v22H25V46Z" fill="#312e81"/>
            <circle cx="48" cy="49" r="17.5" fill="#f5f3ff"/>
            <circle cx="41" cy="49" r="2.6" fill="#312e81"/>
            <circle cx="55" cy="49" r="2.6" fill="#312e81"/>
            <circle cx="37" cy="54" r="3.5" fill="#f472b6" fill-opacity="0.45"/>
            <circle cx="59" cy="54" r="3.5" fill="#f472b6" fill-opacity="0.45"/>
            <circle cx="48" cy="57" r="2" fill="#9333ea"/>
            <path d="M32 76c4-7.5 10-10.5 16-10.5s12 3 16 10.5" fill="#4338ca"/>
          </svg>`,
        alisa: `
          <svg class="anim-float" width="${size}" height="${size}" viewBox="0 0 96 96" fill="none">
            <circle cx="48" cy="48" r="42" fill="#181126" stroke="#d8b4fe" stroke-width="1.8" stroke-opacity="0.5"/>
            <circle cx="28" cy="34" r="9" fill="#581c87"/>
            <circle cx="68" cy="34" r="9" fill="#581c87"/>
            <circle cx="48" cy="49" r="17.5" fill="#faf5ff"/>
            <path d="M38 49c1.5-2 4.5-2 6 0M52 49c1.5-2 4.5-2 6 0" stroke="#4c1d95" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M44 57c2.5 2 5.5 2 8 0" stroke="#9333ea" stroke-width="2" stroke-linecap="round"/>
            <path d="M32 76c4-7.5 10-10.5 16-10.5s12 3 16 10.5" fill="#581c87"/>
          </svg>`,
        marin: `
          <svg class="anim-tilt" width="${size}" height="${size}" viewBox="0 0 96 96" fill="none">
            <circle cx="48" cy="48" r="42" fill="#24180b" stroke="#fbbf24" stroke-width="1.8" stroke-opacity="0.55"/>
            <path d="M22 45c2-20 14-29 26-29s24 9 26 29l4 23H18l4-23Z" fill="#92400e"/>
            <circle cx="48" cy="49" r="17.5" fill="#fffbeb"/>
            <circle cx="41" cy="48" r="3" fill="#be185d"/>
            <circle cx="55" cy="48" r="3" fill="#be185d"/>
            <path d="M42 56.5c3.5 3.5 8.5 3.5 12 0" stroke="#db2777" stroke-width="2.2" stroke-linecap="round"/>
            <path class="anim-pulse" d="M71 22l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z" fill="#fbbf24"/>
            <path d="M31 76c4-8 10-11 17-11s13 3 17 11" fill="#b45309"/>
          </svg>`,
        yuki: `
          <svg class="anim-pulse" width="${size}" height="${size}" viewBox="0 0 96 96" fill="none">
            <circle cx="48" cy="48" r="42" fill="#1f150b" stroke="#f59e0b" stroke-width="1.8" stroke-opacity="0.5"/>
            <path d="M25 44l6-22 10 9 7-13 7 13 10-9 6 22-4 20H29l-4-20Z" fill="#78350f"/>
            <circle cx="48" cy="49" r="17.5" fill="#fef3c7"/>
            <path d="M36 46l9 3M60 46l-9 3" stroke="#451a03" stroke-width="2.3" stroke-linecap="round"/>
            <path d="M43 57.5h10" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M31 76c4-8 10-11 17-11s13 3 17 11" fill="#92400e"/>
          </svg>`
      };

      if (portraits[id]) return portraits[id];

      const colorMap = {
        dom: { bg: "#230b16", stroke: "#fb7185", hair: "#4c0519", shirt: "#881337" },
        sub: { bg: "#151029", stroke: "#c4b5fd", hair: "#312e81", shirt: "#4338ca" },
        brat: { bg: "#24180b", stroke: "#fbbf24", hair: "#92400e", shirt: "#b45309" }
      };
      const pal = colorMap[vibe] || colorMap.sub;

      return `
        <svg class="anim-float" width="${size}" height="${size}" viewBox="0 0 96 96" fill="none">
          <circle cx="48" cy="48" r="42" fill="${pal.bg}" stroke="${pal.stroke}" stroke-width="1.8" stroke-opacity="0.5"/>
          <path d="M24 45c2-19 13-28 24-28s22 9 24 28l3 22H21l3-22Z" fill="${pal.hair}"/>
          <circle cx="48" cy="49" r="17.5" fill="#f5f3ff"/>
          <circle cx="41" cy="49" r="2.6" fill="#1e1b4b"/>
          <circle cx="55" cy="49" r="2.6" fill="#1e1b4b"/>
          <path d="M43 57c3 2 7 2 10 0" stroke="#7e22ce" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M31 76c4-8 10-11 17-11s13 3 17 11" fill="${pal.shirt}"/>
        </svg>`;
    }

    const characters = [
      {
        id: "veronika",
        name: "Вероника",
        vibe: "dom",
        roleLabel: "Доминирующая",
        desc: "Холодная, властная и расчётливая. Берёт инициативу в свои руки и диктует правила сцены.",
        plots: [
          { title: "Приказ в пустом пентхаусе", text: "Поздний вечер, панорамные окна, она медленно поворачивается к тебе с бокалом в руке и не оставляет выбора." },
          { title: "Допрос после сделки", text: "Приглушённый свет, закрытая дверь и прямой взгляд: ей нужны ответы, а не оправдания." }
        ]
      },
      {
        id: "rina",
        name: "Рина",
        vibe: "dom",
        roleLabel: "Доминирующая",
        desc: "Уверенная, насмешливая, привыкла контролировать ситуацию и не терпит неподчинения.",
        plots: [
          { title: "Ночная студия без лишних слов", text: "Она садится на край стола и спокойно смотрит сверху вниз, проверяя твои нервы." },
          { title: "Игра на твоих условиях", text: "Ставка сделана, и именно Рина решает, какой шаг будет следующим." }
        ]
      },
      {
        id: "miya",
        name: "Мия",
        vibe: "sub",
        roleLabel: "Не доминирующая",
        desc: "Тихая, мягкая и податливая. Легко смущается, ждёт твоего решения и охотно следует за тобой.",
        plots: [
          { title: "Тихая ночь после дождя", text: "Она сидит на диване в оверсайз-худи, чуть робея, и тихо ждёт, что ты скажешь первым." },
          { title: "Доверие без лишнего шума", text: "Приглушённый свет, спокойная обстановка — Мия полностью полагается на твой ход." }
        ]
      },
      {
        id: "alisa",
        name: "Алиса",
        vibe: "sub",
        roleLabel: "Не доминирующая",
        desc: "Нежная, уступчивая и внимательная к деталям. Не спорит за лидерство, ей комфортно рядом с сильным партнёром.",
        plots: [
          { title: "Поздний ужин на двоих", text: "На кухне тепло и тихо; Алиса поправляет рукав и мягко улыбается, ожидая твоих действий." },
          { title: "За кулисами съёмки", text: "Усталость после долгого дня, она прислоняется к стене и тихо смотрит на тебя." }
        ]
      },
      {
        id: "marin",
        name: "Китагава Марин",
        vibe: "brat",
        roleLabel: "Дерзкая",
        desc: "Яркая, живая и прямолинейная. Подкалывает, шутит, но быстро становится искренней.",
        plots: [
          { title: "Примерка нового образа", text: "В комнате разложены ткани и реквизит, Марин крутится перед зеркалом и с ухмылкой смотрит на тебя." },
          { title: "Полночный перекус и разговоры", text: "Пустая кухня, две банки напитка и бесконечные истории до утра." }
        ]
      },
      {
        id: "yuki",
        name: "Юки",
        vibe: "brat",
        roleLabel: "Дерзкая",
        desc: "Колючая снаружи, но легко выдаёт эмоции, когда её задевают за живое.",
        plots: [
          { title: "Крыша ночного города", text: "Ветер треплет волосы, Юки скрещивает руки и бросает вызов: «И что дальше?»" }
        ]
      }
    ];

    let currentFilter = "all";
    let activeChar = null;
    let activePlot = null;
    let history = [];
    let domOverride = "auto";

    const cfg = {
      format: "Действия в *звёздочках*",
      slang: "Живой / мат ок",
      pov: "От 1-го лица"
    };

    function allChars() {
      const custom = JSON.parse(localStorage.getItem("nocturne_custom_chars") || "[]");
      return [...characters, ...custom];
    }

    function setFilter(f, el) {
      currentFilter = f;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      renderGrid();
    }

    function renderGrid() {
      const q = (document.getElementById("q").value || "").trim().toLowerCase();
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      const createTile = document.createElement("div");
      createTile.className = "card create-card";
      createTile.onclick = openCreate;
      createTile.innerHTML = `
        <div class="card-bg">
          <svg class="anim-pulse" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="1.8">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </div>
        <div class="card-grad"></div>
        <div class="card-top"><span class="role-tag">Свой</span></div>
        <div class="card-body">
          <h4>Создать персонажа</h4>
          <p>Задай характер, доминацию или мягкость и свой старт.</p>
        </div>
      `;
      grid.appendChild(createTile);

      const list = allChars().filter(c => {
        if (currentFilter === "custom" && !c.custom) return false;
        if (["dom", "sub", "brat"].includes(currentFilter) && c.vibe !== currentFilter) return false;
        if (!q) return true;
        return c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || c.roleLabel.toLowerCase().includes(q);
      });

      list.forEach(c => {
        const tile = document.createElement("div");
        tile.className = "card";
        tile.onclick = () => openChar(c);
        tile.innerHTML = `
          <div class="card-bg">${renderCharAvatar(c.id, c.vibe, 92)}</div>
          <div class="card-grad"></div>
          <div class="card-top">
            <span class="role-tag ${c.vibe}">${c.roleLabel}</span>
          </div>
          <div class="card-body">
            <h4>${c.name}</h4>
            <p>${c.desc}</p>
          </div>
        `;
        grid.appendChild(tile);
      });
    }

    function openChar(c) {
      activeChar = c;
      activePlot = null;
      history = [];
      domOverride = "auto";
      updateDomPill();

      document.getElementById("room-ava").innerHTML = renderCharAvatar(c.id, c.vibe, 42);
      document.getElementById("picker-ava").innerHTML = renderCharAvatar(c.id, c.vibe, 58);
      document.getElementById("room-name").textContent = c.name;
      document.getElementById("room-sub").textContent = `${c.roleLabel} · выбери сюжет`;
      document.getElementById("picker-title").textContent = `${c.name} · ${c.roleLabel}`;
      document.getElementById("picker-desc").textContent = c.desc;

      const plotsBox = document.getElementById("picker-plots");
      plotsBox.innerHTML = "";
      (c.plots || []).forEach(p => {
        const div = document.createElement("div");
        div.className = "plot-option";
        div.onclick = () => startPlot(p);
        div.innerHTML = `
          <div class="plot-option-head"><span>${p.title}</span><span>→</span></div>
          <div class="plot-option-desc">${p.text}</div>
        `;
        plotsBox.appendChild(div);
      });

      document.getElementById("scene-picker").style.display = "block";
      document.getElementById("chat-stream").innerHTML = "";
      switchScreen("screen-room");
    }

    function startPlot(p) {
      activePlot = p;
      document.getElementById("scene-picker").style.display = "none";
      document.getElementById("room-sub").textContent = `${activeChar.roleLabel} · ${p.title}`;
      addBubble("bot", `*${p.title}.* ${p.text}`);
    }

    function resetRoom() {
      if (!activeChar) return;
      openChar(activeChar);
    }

    function addBubble(role, text) {
      history.push({ role, text });
      const stream = document.getElementById("chat-stream");
      const el = document.createElement("div");
      el.className = "bubble " + role;
      el.textContent = text;
      stream.appendChild(el);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function sendChat() {
      const inp = document.getElementById("chat-input");
      const text = inp.value.trim();
      if (!text) return;
      if (!activeChar) activeChar = allChars()[0];

      if (document.getElementById("scene-picker").style.display !== "none") {
        document.getElementById("scene-picker").style.display = "none";
      }

      inp.value = "";
      addBubble("user", text);

      const effectiveVibe = domOverride === "auto" ? activeChar.vibe : domOverride;
      let reply = "";
      if (effectiveVibe === "dom") {
        reply = `*${activeChar.name} смотрит на тебя спокойно и уверенно, не уступая инициативы.* «${text}» — звучит интересно. Посмотрим, как ты поведёшь себя дальше.`;
      } else if (effectiveVibe === "sub") {
        reply = `*${activeChar.name} слегка опускает взгляд, но быстро поднимает его на тебя, готовая подстроиться.* Хорошо… как скажешь насчёт «${text}»?`;
      } else {
        reply = `*${activeChar.name} усмехается и кивает с лёгким вызовом.* Ну-ну, «${text}». И что ты собираешься делать дальше?`;
      }

      setTimeout(() => addBubble("bot", reply), 220);
    }

    function requestSceneArt() {
      if (!activeChar) return;
      if (document.getElementById("scene-picker").style.display !== "none") {
        document.getElementById("scene-picker").style.display = "none";
      }
      const last = history[history.length - 1]?.text || activePlot?.text || activeChar.desc;
      const prompt = encodeURIComponent(last.slice(0, 110) + ", dark anime moody lighting, cinematic");
      const url = `https://image.pollinations.ai/prompt/${prompt}?model=flux&nologo=true&t=${Date.now()}`;

      const probe = new Image();
      probe.onload = () => {
        addBubble("bot", `Арт для сцены с ${activeChar.name}:`);
        const stream = document.getElementById("chat-stream");
        const img = document.createElement("img");
        img.src = url;
        img.alt = "Сцена";
        img.style.cssText = "max-width:88%;border-radius:14px;border:1px solid var(--line);align-self:flex-start;";
        stream.appendChild(img);
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      };
      probe.onerror = () => {
        addBubble("bot", "Генератор картинок сейчас на лимите или недоступен — продолжи сцену текстом или попробуй через минуту.");
      };
      probe.src = url;
    }

    function toggleDominance() {
      const order = ["auto", "dom", "sub"];
      domOverride = order[(order.indexOf(domOverride) + 1) % order.length];
      updateDomPill();
    }

    function updateDomPill() {
      const btn = document.getElementById("pill-mode");
      const labels = {
        auto: "Доминация: Авто",
        dom: "Доминация: Вкл",
        sub: "Доминация: Выкл"
      };
      btn.textContent = labels[domOverride];
      btn.classList.toggle("on", domOverride !== "auto");
    }

    function openCreate() { closeAll(); document.getElementById("backdrop-create").classList.add("open"); }
    function openStyle() { closeAll(); document.getElementById("backdrop-style").classList.add("open"); }
    function openCustomPlotForChar() {
      if (!activeChar) return;
      closeAll();
      document.getElementById("backdrop-plot").classList.add("open");
    }

    function applyCustomPlot() {
      const title = document.getElementById("p-title").value.trim() || "Свой сюжет";
      const text = document.getElementById("p-text").value.trim() || "Сцена начинается.";
      document.getElementById("p-title").value = "";
      document.getElementById("p-text").value = "";
      closeAll();
      startPlot({ title, text });
    }

    function saveCustomChar() {
      const name = document.getElementById("c-name").value.trim();
      const vibe = document.getElementById("c-vibe").value;
      const desc = document.getElementById("c-desc").value.trim() || "Свой персонаж.";
      const plotText = document.getElementById("c-plot").value.trim() || "Сцена начинается.";
      if (!name) return alert("Укажи имя");

      const labels = { dom: "Доминирующая", sub: "Не доминирующая", brat: "Дерзкая" };
      const item = {
        id: "custom_" + Date.now(),
        name,
        vibe,
        roleLabel: labels[vibe],
        desc,
        custom: true,
        plots: [{ title: "Стартовая сцена", text: plotText }]
      };

      const custom = JSON.parse(localStorage.getItem("nocturne_custom_chars") || "[]");
      custom.push(item);
      localStorage.setItem("nocturne_custom_chars", JSON.stringify(custom));

      document.getElementById("c-name").value = "";
      document.getElementById("c-desc").value = "";
      document.getElementById("c-plot").value = "";
      closeAll();
      openChar(item);
    }

    function cycleCfg(key, arr) {
      cfg[key] = arr[(arr.indexOf(cfg[key]) + 1) % arr.length];
      document.getElementById("cfg-" + key).textContent = cfg[key];
    }

    function closeAll() {
      document.querySelectorAll(".backdrop").forEach(b => b.classList.remove("open"));
    }

    function switchScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function showCatalog() {
      switchScreen("screen-catalog");
      renderGrid();
    }

    function openActiveOrFirst() {
      if (activeChar) {
        switchScreen("screen-room");
      } else {
        openChar(allChars()[0]);
      }
    }

    renderGrid();
  </script>
</body>
</html>
